name: CodeQL

on:
  # Weekly scan, Friday ~06:00 UTC, plus manual dispatch and main pushes.
  # Deliberately NOT pull_request: the PR pipeline's wall clock is ~5 min
  # and CodeQL would roughly double it. Main pushes carry the scan so any
  # new finding is caught within a week of merge.
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required for CodeQL to upload SARIF results to the code scanning tab.
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
