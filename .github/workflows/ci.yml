name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: covnant_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations to scratch Postgres
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0001_covenant_init.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0002_contracts.sql
          # Supabase-auth shim (test-only, never shipped as a migration):
          # migrations 0003/0004/0005 assume the Supabase environment — the
          # auth.users table, the auth.uid() helper, and the
          # authenticated/service_role roles — which vanilla Postgres lacks.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 <<'SQL'
            create schema if not exists auth;
            create table if not exists auth.users (id uuid primary key);
            create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
            do $$ begin
              if not exists (select from pg_roles where rolname = 'authenticated') then
                create role authenticated nologin;
              end if;
              if not exists (select from pg_roles where rolname = 'service_role') then
                create role service_role nologin;
              end if;
            end $$;
          SQL
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0003_creator_profiles.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0004_creator_compliance.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0005_admin_action_log.sql
          # Don Engine persistence (spec art_zxsnGP3A): the canonical 27-table
          # schema + the atomic record_checkout_purchase RPC. Applied twice —
          # the second apply must be a clean no-op (ON_ERROR_STOP=1), proving
          # the migration is idempotent.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0006_don_engine.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0006_don_engine.sql
          # SDK collection surfaces + Sync Library + concurrency guards +
          # phone verification (0007-0010), then the Deep Royalties recon
          # queue (spec art_7M0snhxc): 0011 applied twice — the second apply
          # must be a clean no-op, proving idempotency.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0007_sdk_collection.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0008_sync_library.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0009_concurrency_guards.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0010_phone_verifications.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0011_royalty_recon_jobs.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0011_royalty_recon_jobs.sql

      - name: Assert the engine's exact columns exist
        env:
          PGPASSWORD: postgres
        run: |
          assert_cols() {
            local table="$1"; shift
            local cols=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select column_name from information_schema.columns where table_schema='public' and table_name='$table'")
            for col in "$@"; do
              echo "$cols" | grep -qx "$col" || { echo "MISSING $table.$col"; exit 1; }
            done
            echo "OK: $table ($# columns asserted)"
          }
          assert_cols cbt_assets cbt_code
          assert_cols universal_royalty_ledger transaction_id cbt_code platform gross_settled covenant_fee corner_dust_collected currency disbursements created_at
          assert_cols platform_allowlists cbt_code
          assert_cols contracts id cbt_code template_id industry status fields document
          assert_cols creator_profiles id stage_name legal_name email phone phone_verified_at core_industry title udr_terms_accepted_at created_at kyc_status tax_form_type tax_verified bank_account_linked

          # Compliance columns: exact defaults + nullability (migration 0004),
          # checked against information_schema on the real scratch Postgres.
          assert_col_shape() {
            local table="$1" col="$2" want="$3"
            local got=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select is_nullable || '|' || coalesce(column_default, '<none>') from information_schema.columns where table_schema='public' and table_name='$table' and column_name='$col'")
            [ "$got" = "$want" ] || { echo "BAD $table.$col: got '$got', want '$want'"; exit 1; }
            echo "OK: $table.$col = $want"
          }
          assert_col_shape creator_profiles kyc_status "YES|'PENDING_INITIALIZATION'::character varying"
          assert_col_shape creator_profiles tax_form_type "YES|'W9'::character varying"
          assert_col_shape creator_profiles tax_verified "YES|false"
          assert_col_shape creator_profiles bank_account_linked "YES|false"

          # Don Engine tables (migration 0006): the canonical table inventory
          # and the columns the Store contract reads and writes, checked
          # against information_schema on the real scratch Postgres.
          for table in shows live_pings artists checkout_sessions plaid_link_tokens \
            kyc_verifications split_runs royalty_line_items ledger_transactions \
            baas_transfers company_dust_ledger creator_tax_profiles creator_ytd_earnings \
            tax_escrow_ledger sovereign_vaults plaid_processor_tokens recoupment_advances \
            vault_disputes payout_holds baas_webhook_events payout_reversals gl_journals \
            gl_entries recoupment_ledger catalog_disputes dsp_webhook_events split_reversals; do
            table_exists=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select count(*) from information_schema.tables where table_schema='public' and table_name='$table'")
            [ "$table_exists" = "1" ] || { echo "MISSING TABLE $table"; exit 1; }
          done
          echo "OK: all 27 Don tables exist"
          assert_cols gl_journals id kind ref_type ref_id created_at sequence prev_hash entry_hash state
          assert_cols gl_entries id journal_id account debit_cents credit_cents created_at
          assert_cols ledger_transactions id split_run_id line_item_id payee_id payee_name role share_bps amount_cents currency status rail baas_provider baas_transfer_id created_at settled_at kind
          assert_cols baas_transfers id provider rail payee_id payee_name amount_cents currency status ledger_transaction_id created_at estimated_settlement
          assert_cols payout_holds transfer_id payee_id amount_cents status created_at
          assert_cols split_runs id source period currency gross_cents line_item_count variance_account_cents created_at status
          assert_cols creator_tax_profiles creator_id tin_verified w9_on_file updated_at
          assert_cols creator_ytd_earnings creator_id tax_year gross_cents withheld_cents updated_at
          assert_cols sovereign_vaults payee_id payee_name available_balance pending_balance reserve_balance updated_at
          assert_cols recoupment_advances creator_id creator_name recoupment_target_cents recoupment_current_cents recoupment_bps updated_at

          # The atomic checkout RPC SupabaseStore.recordCheckoutPurchase calls.
          rpc_exists=$(psql -h localhost -U postgres -d covnant_check -tAc \
            "select count(*) from pg_proc p join pg_namespace n on p.pronamespace = n.oid where n.nspname = 'public' and p.proname = 'record_checkout_purchase'")
          [ "$rpc_exists" = "1" ] || { echo "MISSING RPC record_checkout_purchase"; exit 1; }
          echo "OK: record_checkout_purchase RPC exists"

          # Deep Royalties recon queue (migration 0011, spec art_7M0snhxc):
          # the orchestration table's inventory, the claim RPC, the pg_net
          # completion trigger, and the check-constrained status — a bad
          # status value must be REJECTED, never silently stored.
          assert_cols royalty_recon_jobs id status source ingest_id requested_by engine attempts error result claimed_at started_at completed_at created_at updated_at insertion_order
          rls_enabled=$(psql -h localhost -U postgres -d covnant_check -tAc \
            "select relrowsecurity from pg_class c join pg_namespace n on c.relnamespace = n.oid where n.nspname='public' and c.relname='royalty_recon_jobs'")
          [ "$rls_enabled" = "t" ] || { echo "RLS NOT ENABLED on royalty_recon_jobs"; exit 1; }
          echo "OK: royalty_recon_jobs RLS enabled"
          # The check constraint MUST reject this insert — psql exits non-zero
          # by design. `|| true` keeps the step alive under the workflow's
          # `bash -eo pipefail` (the rejection is the expectation, not an error).
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into royalty_recon_jobs (id, status, source) values (gen_random_uuid(), 'engine_running', 'statement')" >/dev/null 2>&1 || true
          bad_status=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from royalty_recon_jobs where status = 'engine_running'")
          [ "$bad_status" = "0" ] || { echo "BAD STATUS ACCEPTED by the check constraint"; exit 1; }
          echo "OK: royalty_recon_jobs status check constraint rejects bad values"
          claim_rpc=$(psql -h localhost -U postgres -d covnant_check -tAc \
            "select count(*) from pg_proc p join pg_namespace n on p.pronamespace = n.oid where n.nspname = 'public' and p.proname = 'claim_royalty_recon_job'")
          [ "$claim_rpc" = "1" ] || { echo "MISSING RPC claim_royalty_recon_job"; exit 1; }
          echo "OK: claim_royalty_recon_job RPC exists"
          trigger_exists=$(psql -h localhost -U postgres -d covnant_check -tAc \
            "select count(*) from pg_trigger where tgrelid = 'public.royalty_recon_jobs'::regclass and tgisinternal = false")
          [ "$trigger_exists" -ge "1" ] || { echo "MISSING recon completion trigger"; exit 1; }
          echo "OK: recon completion trigger exists"
          # The directive-addendum vertical columns on match_queue (rights
          # separation, film waterfall, podcast, gaming, livestream/esports,
          # derivative inheritance, publishing) — the parser and engine PRs
          # build on this schema, so CI asserts every column exists.
          assert_cols match_queue event_id status reason rights_pipeline rights_type tier_level statement_source_type revenue_channel ad_slot verified_impressions network_sold sale_type virtual_currency_code virtual_amount exchange_rate engine_royalty_micros platform_commission_micros parent_asset_id stream_platform alert_type revenue_basis prize_pool_batch parent_composition_id is_cover_version territory_code foreign_tax_withheld rss_feed_id ad_placement_type format_type language_code sku_id cogs_per_unit_micros usage_unit usage_quantity isbn country_code ai_model_id dataset_attribution_weight artwork_id provenance_hash jurisdiction_code production_id venue_id show_date license_class license_id category_code territory_iso athlete_id school_id state_jurisdiction_code zone_code spatial_footprint_sqft trainer_id program_id studio_franchise_code chef_id recipe_id ghost_kitchen_location_id stylist_id salon_location_id protocol_id developer_id api_endpoint_id sdk_package_hash patent_family_id sep_pool_code device_imei_mac parcel_id well_meter_id gpu_cluster_hash source platform territory period currency gross_micros identifiers_json raw_payload matched_cbt_code resolved_at
          # The check-constrained vertical vocabularies MUST reject bad values.
          # Every probe supplies the NOT NULL columns (reason, raw_payload) so
          # the ONLY possible failure cause is the check constraint itself — a
          # probe that failed on an unset column would false-pass the assertion.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into match_queue (id, event_id, rights_pipeline, source, reason, raw_payload, statement_source_type) values (gen_random_uuid()::text, 'evt_bad_stmt', 'composition_performance', 'statement', 'probe', '{}', 'vhs_tape')" >/dev/null 2>&1 || true
          bad_stmt=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from match_queue where statement_source_type = 'vhs_tape'")
          [ "$bad_stmt" = "0" ] || { echo "BAD statement_source_type ACCEPTED by the check constraint"; exit 1; }
          echo "OK: match_queue statement_source_type check rejects bad values"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into match_queue (id, event_id, rights_pipeline, source, reason, raw_payload, ad_placement_type) values (gen_random_uuid()::text, 'evt_bad_slot', 'composition_performance', 'statement', 'probe', '{}', 'billboard')" >/dev/null 2>&1 || true
          bad_slot=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from match_queue where ad_placement_type = 'billboard'")
          [ "$bad_slot" = "0" ] || { echo "BAD ad_placement_type ACCEPTED by the check constraint"; exit 1; }
          echo "OK: match_queue ad_placement_type check rejects bad values"
          # Livestream and game-platform kinds are FIRST-CLASS in the extended
          # statement vocabulary — accepted, not rejected.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into match_queue (id, event_id, rights_pipeline, source, reason, raw_payload, statement_source_type) values (gen_random_uuid()::text, 'evt_good_stream', 'composition_performance', 'statement', 'probe', '{}', 'livestream')" >/dev/null 2>&1 || true
          good_stream=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from match_queue where statement_source_type = 'livestream'")
          [ "$good_stream" = "1" ] || { echo "livestream statement_source_type REJECTED — the extended vocabulary is missing"; exit 1; }
          echo "OK: match_queue statement_source_type accepts livestream and game_platform kinds"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E suite
        run: npm run test:e2e
        env:
          # Throwaway e2e password — deliberately NOT the production secret.
          # The production ADMIN_DASHBOARD_PASSWORD is set in Vercel after merge.
          ADMIN_DASHBOARD_PASSWORD: e2e-admin-test-password
