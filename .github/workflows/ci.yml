name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: covnant_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations to scratch Postgres
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0001_covenant_init.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0002_contracts.sql
          # Supabase-auth shim (test-only, never shipped as a migration):
          # migrations 0003/0004/0005 assume the Supabase environment — the
          # auth.users table, the auth.uid() helper, and the
          # authenticated/service_role roles — which vanilla Postgres lacks.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 <<'SQL'
            create schema if not exists auth;
            create table if not exists auth.users (id uuid primary key);
            create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
            do $$ begin
              if not exists (select from pg_roles where rolname = 'authenticated') then
                create role authenticated nologin;
              end if;
              if not exists (select from pg_roles where rolname = 'service_role') then
                create role service_role nologin;
              end if;
            end $$;
          SQL
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0003_creator_profiles.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0004_creator_compliance.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0005_admin_action_log.sql

      - name: Assert the engine's exact columns exist
        env:
          PGPASSWORD: postgres
        run: |
          assert_cols() {
            local table="$1"; shift
            local cols=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select column_name from information_schema.columns where table_schema='public' and table_name='$table'")
            for col in "$@"; do
              echo "$cols" | grep -qx "$col" || { echo "MISSING $table.$col"; exit 1; }
            done
            echo "OK: $table ($# columns asserted)"
          }
          assert_cols cbt_assets cbt_code
          assert_cols universal_royalty_ledger transaction_id cbt_code platform gross_settled covenant_fee corner_dust_collected currency disbursements created_at
          assert_cols platform_allowlists cbt_code
          assert_cols contracts id cbt_code template_id industry status fields document
          assert_cols creator_profiles id stage_name legal_name email phone phone_verified_at core_industry title udr_terms_accepted_at created_at kyc_status tax_form_type tax_verified bank_account_linked

          # Compliance columns: exact defaults + nullability (migration 0004),
          # checked against information_schema on the real scratch Postgres.
          assert_col_shape() {
            local table="$1" col="$2" want="$3"
            local got=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select is_nullable || '|' || coalesce(column_default, '<none>') from information_schema.columns where table_schema='public' and table_name='$table' and column_name='$col'")
            [ "$got" = "$want" ] || { echo "BAD $table.$col: got '$got', want '$want'"; exit 1; }
            echo "OK: $table.$col = $want"
          }
          assert_col_shape creator_profiles kyc_status "YES|'PENDING_INITIALIZATION'::character varying"
          assert_col_shape creator_profiles tax_form_type "YES|'W9'::character varying"
          assert_col_shape creator_profiles tax_verified "YES|false"
          assert_col_shape creator_profiles bank_account_linked "YES|false"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E suite
        run: npm run test:e2e
        env:
          # Throwaway e2e password — deliberately NOT the production secret.
          # The production ADMIN_DASHBOARD_PASSWORD is set in Vercel after merge.
          ADMIN_DASHBOARD_PASSWORD: e2e-admin-test-password
