          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into composition_publishers (composition_id, publisher_payee_id, publisher_payee_name, share_bps) values ('11111111-1111-4111-8111-111111111111', 'pub_probe_1', 'Probe Publisher', 5000)"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into composition_publishers (composition_id, publisher_payee_id, publisher_payee_name, share_bps) values ('11111111-1111-4111-8111-111111111111', 'pub_probe_1', 'Probe Publisher', 6000)" >/dev/null 2>&1 || true
          dup_pubs=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from composition_publishers where composition_id = '11111111-1111-4111-8111-111111111111'")
          [ "$dup_pubs" = "1" ] || { echo "DUPLICATE PUBLISHER ACCEPTED by the UNIQUE pair"; exit 1; }
          echo "OK: composition_publishers UNIQUE pair rejects duplicate publishers"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into composition_publishers (composition_id, publisher_payee_id, publisher_payee_name, share_bps) values ('11111111-1111-4111-8111-111111111111', 'pub_probe_2', 'Probe Publisher 2', 10001)" >/dev/null 2>&1 || true
          greedy_share=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from composition_publishers where share_bps > 10000")
          [ "$greedy_share" = "0" ] || { echo "SHARE BPS ABOVE 10000 ACCEPTED by the check constraint"; exit 1; }
          echo "OK: composition_publishers share_bps check rejects more than the whole pool"

          # Film multi-territory withholding + cross-collateralization
          # firewall (migration 0023, Deep Royalties PR 18): the withholding
          # log's inventory, RLS deny-all, the guarded line-event FK, the
          # rate-consistency and UNIQUE replay checks, and the territory
          # envelopes' CAMA firewall invariant.
          assert_cols film_territory_withholdings id event_id film_id territory_code foreign_tax_withheld withholding_rate_bps rate_table_version source_currency gross_source_micros withheld_source_micros net_source_micros base_currency fx_rate_micros gross_base_cents withheld_base_cents net_base_cents created_at insertion_order
          assert_cols film_territory_distributions id film_id escrow_ledger_id territory_code status fdg_bypass_cents legs tier_allocations unpaid_total_cents cross_collateralization_permitted cross_applications created_at insertion_order
          for table in film_territory_withholdings film_territory_distributions; do
            rls_enabled=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select relrowsecurity from pg_class c join pg_namespace n on c.relnamespace = n.oid where n.nspname='public' and c.relname='$table'")
            [ "$rls_enabled" = "t" ] || { echo "RLS NOT ENABLED on $table"; exit 1; }
          done
          echo "OK: film territory tables have RLS enabled"
          fk_exists=$(psql -h localhost -U postgres -d covnant_check -tAc \
            "select count(*) from pg_constraint where conrelid = 'public.film_territory_withholdings'::regclass and conname = 'fk_film_territory_withholdings_event'")
          [ "$fk_exists" = "1" ] || { echo "MISSING FK fk_film_territory_withholdings_event"; exit 1; }
          echo "OK: fk_film_territory_withholdings_event exists"
          # The FK MUST reject a withholding log against a line that never
          # entered the match queue — the insert is expected to fail.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into film_territory_withholdings (event_id, film_id, territory_code, foreign_tax_withheld, withholding_rate_bps, source_currency, gross_source_micros, withheld_source_micros, net_source_micros, base_currency, fx_rate_micros, gross_base_cents, withheld_base_cents, net_base_cents) values ('no-such-film-line', 'film_wh_probe', 'FR', false, 0, 'EUR', '1000000000', '0', '1000000000', 'USD', 1080000, 108, 0, 108)" >/dev/null 2>&1 || true
          orphan_wh=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from film_territory_withholdings where event_id = 'no-such-film-line'")
          [ "$orphan_wh" = "0" ] || { echo "ORPHAN WITHHOLDING LOG ACCEPTED — the line-event FK is missing"; exit 1; }
          echo "OK: film_territory_withholdings line-event FK rejects unmatched lines"
          # The rate-consistency check: a withheld line pairs a positive
          # treaty rate with a rate-table version; an unwithheld line pairs
          # zero with null. Anything else refuses at the DDL.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into match_queue (id, event_id, rights_pipeline, source, reason, raw_payload) values (gen_random_uuid()::text, 'evt_film_wh_probe', 'composition_performance', 'statement', 'probe', '{}')"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into film_territory_withholdings (event_id, film_id, territory_code, foreign_tax_withheld, withholding_rate_bps, source_currency, gross_source_micros, withheld_source_micros, net_source_micros, base_currency, fx_rate_micros, gross_base_cents, withheld_base_cents, net_base_cents) values ('evt_film_wh_probe', 'film_wh_probe', 'FR', true, 0, 'EUR', '1000000000', '0', '1000000000', 'USD', 1080000, 108, 0, 108)" >/dev/null 2>&1 || true
          bad_wh=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from film_territory_withholdings where event_id = 'evt_film_wh_probe' and withholding_rate_bps = 0")
          [ "$bad_wh" = "0" ] || { echo "WITHHELD LINE WITH ZERO RATE ACCEPTED by the consistency check"; exit 1; }
          echo "OK: film_territory_withholdings rate-consistency check rejects an unpaired withheld line"
          # One withholding log per line, ever: the UNIQUE event_id refuses
          # a replayed line (23505), the engine recovers by reading.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into film_territory_withholdings (event_id, film_id, territory_code, foreign_tax_withheld, withholding_rate_bps, rate_table_version, source_currency, gross_source_micros, withheld_source_micros, net_source_micros, base_currency, fx_rate_micros, gross_base_cents, withheld_base_cents, net_base_cents) values ('evt_film_wh_probe', 'film_wh_probe', 'FR', true, 3000, 'treaty-2026-v1', 'EUR', '1000000000', '300000000', '700000000', 'USD', 1080000, 108, 32, 76)"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into film_territory_withholdings (event_id, film_id, territory_code, foreign_tax_withheld, withholding_rate_bps, rate_table_version, source_currency, gross_source_micros, withheld_source_micros, net_source_micros, base_currency, fx_rate_micros, gross_base_cents, withheld_base_cents, net_base_cents) values ('evt_film_wh_probe', 'film_wh_probe', 'FR', true, 3000, 'treaty-2026-v1', 'EUR', '1000000000', '300000000', '700000000', 'USD', 1080000, 108, 32, 76)" >/dev/null 2>&1 || true
          dup_wh=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from film_territory_withholdings where event_id = 'evt_film_wh_probe'")
          [ "$dup_wh" = "1" ] || { echo "DUPLICATE WITHHOLDING LOG ACCEPTED by the UNIQUE event_id"; exit 1; }
          echo "OK: film_territory_withholdings UNIQUE event_id rejects a replayed line"
          # The CAMA firewall as a database invariant: a cross-application
          # row without the explicit override flag refuses at the DDL.
          fk_exists=$(psql -h localhost -U postgres -d covnant_check -tAc \
            "select count(*) from pg_constraint where conrelid = 'public.film_territory_distributions'::regclass and conname = 'fk_film_territory_distributions_escrow'")
          [ "$fk_exists" = "1" ] || { echo "MISSING FK fk_film_territory_distributions_escrow"; exit 1; }
          echo "OK: fk_film_territory_distributions_escrow exists"
          # The FK MUST reject an envelope routed against an escrow receipt
          # that never landed in ledger_transactions.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into film_territory_distributions (film_id, escrow_ledger_id, territory_code, legs, tier_allocations) values ('film_cama_probe', 'no-such-receipt-cama', 'FR', '{}', '{}')" >/dev/null 2>&1 || true
          orphan_dist=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from film_territory_distributions where escrow_ledger_id = 'no-such-receipt-cama'")
          [ "$orphan_dist" = "0" ] || { echo "ORPHAN TERRITORY ENVELOPE ACCEPTED — the escrow FK is missing"; exit 1; }
          echo "OK: film_territory_distributions escrow FK rejects unrouted receipts"
          # One routing decision per released receipt per territory, ever:
          # the UNIQUE (escrow_ledger_id, territory_code) pair refuses a
          # duplicate envelope but not a second territory on the same
          # receipt — the territory partition stays open, the per-territory
          # row stays single.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into ledger_transactions (id, split_run_id, line_item_id, payee_id, payee_name, role, share_bps, amount_cents, currency, status, created_at, kind) values ('escrow_cama_probe', 'run_cama_probe', 'line_cama_probe', 'film_escrow:film_cama_probe', 'Film escrow', 'platform', 10000, 50000, 'USD', 'escrow_waterfall_pending', now(), 'escrow_waterfall_pending')"
          # The CAMA firewall as a database invariant: a cross-application
          # row without the explicit override flag refuses at the DDL. The
          # insert targets the REAL receipt above, so the only possible
          # failure cause is the check constraint itself.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into film_territory_distributions (film_id, escrow_ledger_id, territory_code, legs, tier_allocations, cross_collateralization_permitted, cross_applications) values ('film_cama_probe', 'escrow_cama_probe', 'FR', '{}', '{}', false, '[{\"debtor_territory\":\"DE\",\"creditor_territory\":\"FR\",\"debtor_leg_id\":\"leg_1\",\"applied_cents\":100}]')" >/dev/null 2>&1 || true
          cross_probe=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from film_territory_distributions where film_id = 'film_cama_probe' and cross_applications is not null")
          [ "$cross_probe" = "0" ] || { echo "CROSS-APPLICATION WITHOUT THE CAMA FLAG ACCEPTED by the check constraint"; exit 1; }
          echo "OK: film_territory_distributions refuses a cross-application without the CAMA override"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into film_territory_distributions (film_id, escrow_ledger_id, territory_code, legs, tier_allocations) values ('film_cama_probe', 'escrow_cama_probe', 'FR', '{}', '{}')"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into film_territory_distributions (film_id, escrow_ledger_id, territory_code, legs, tier_allocations) values ('film_cama_probe', 'escrow_cama_probe', 'FR', '{}', '{}')" >/dev/null 2>&1 || true
          dup_env=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from film_territory_distributions where escrow_ledger_id = 'escrow_cama_probe' and territory_code = 'FR'")
          [ "$dup_env" = "1" ] || { echo "DUPLICATE TERRITORY ENVELOPE ACCEPTED by the UNIQUE pair"; exit 1; }
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into film_territory_distributions (film_id, escrow_ledger_id, territory_code, legs, tier_allocations) values ('film_cama_probe', 'escrow_cama_probe', 'DE', '{}', '{}')"
          multi_env=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from film_territory_distributions where escrow_ledger_id = 'escrow_cama_probe'")
          [ "$multi_env" = "2" ] || { echo "SECOND TERRITORY ENVELOPE REFUSED — the receipt partition is not per-territory"; exit 1; }
          echo "OK: film_territory_distributions UNIQUE pair rejects duplicates, keeps the territory partition open"
          # A status outside the routed/applied lifecycle refuses at the DDL.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into film_territory_distributions (film_id, escrow_ledger_id, territory_code, status, legs, tier_allocations) values ('film_cama_probe', 'escrow_cama_probe', 'UK', 'settled', '{}', '{}')" >/dev/null 2>&1 || true
          bad_status=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from film_territory_distributions where territory_code = 'UK'")
          [ "$bad_status" = "0" ] || { echo "BAD ENVELOPE STATUS ACCEPTED by the check constraint"; exit 1; }
          echo "OK: film_territory_distributions status check rejects off-lifecycle states"

          # Webtoon studio splits + per-language translation cascades
          # (migration 0024, Deep Royalties PR 20): the six contract-ledger
          # tables' inventory, RLS deny-all, the guarded pool FK, and the
          # check-constrained vocabularies.
          assert_cols webtoon_studio_split_roles id series_id role_group payee_id payee_name share_bps contract_ref created_at insertion_order
          assert_cols webtoon_localization_contracts id series_id language_code localizer_payee_id localizer_payee_name fee_mode per_chapter_flat_fee_cents rev_share_bps contract_ref created_at
          assert_cols webtoon_localization_cost_schedules id schedule_ref series_id language_code total_cost_cents amortization_periods cost_agreement_ref created_at
          assert_cols webtoon_localization_cost_lines id schedule_ref line_index amount_cents released_in_ledger_id created_at
          assert_cols webtoon_recoupment_pools id series_id pool_class advance_cents recouped_cents currency status advance_agreement_ref created_at updated_at
          assert_cols webtoon_recoupment_applications id pool_id pool_class source_event_id applied_cents remaining_cents created_at
          for table in webtoon_studio_split_roles webtoon_localization_contracts webtoon_localization_cost_schedules webtoon_localization_cost_lines webtoon_recoupment_pools webtoon_recoupment_applications; do
            rls_enabled=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select relrowsecurity from pg_class c join pg_namespace n on c.relnamespace = n.oid where n.nspname='public' and c.relname='$table'")
            [ "$rls_enabled" = "t" ] || { echo "RLS NOT ENABLED on $table"; exit 1; }
          done
          echo "OK: the six webtoon split/cascade tables have RLS enabled"
          fk_exists=$(psql -h localhost -U postgres -d covnant_check -tAc \
            "select count(*) from pg_constraint where conrelid = 'public.webtoon_recoupment_applications'::regclass and conname = 'webtoon_recoupment_applications_pool_id_fkey'")
          [ "$fk_exists" = "1" ] || { echo "MISSING FK webtoon_recoupment_applications_pool_id_fkey"; exit 1; }
          echo "OK: webtoon_recoupment_applications pool FK exists"
          # The FK MUST reject an application routed against a pool that
          # never landed — the insert is expected to fail.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into webtoon_recoupment_applications (pool_id, pool_class, source_event_id, applied_cents, remaining_cents) values ('00000000-0000-0000-0000-000000000024', 'print_advance', 'wt:recoup:no-such-event', 100, 900)" >/dev/null 2>&1 || true
          orphan_app=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from webtoon_recoupment_applications where source_event_id = 'wt:recoup:no-such-event'")
          [ "$orphan_app" = "0" ] || { echo "ORPHAN RECOUPMENT APPLICATION ACCEPTED — the pool FK is missing"; exit 1; }
          echo "OK: webtoon_recoupment_applications pool FK rejects unrouted applications"
          # The role vocabulary is exactly the three production groups:
          # anything else refuses at the DDL.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into webtoon_studio_split_roles (series_id, role_group, payee_id, payee_name, share_bps, contract_ref) values ('wt_split_probe', 'assistant', 'payee_1', 'Payee', 1000, 'AGR-SPLIT-PROBE')" >/dev/null 2>&1 || true
          bad_group=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from webtoon_studio_split_roles where series_id = 'wt_split_probe'")
          [ "$bad_group" = "0" ] || { echo "FOREIGN ROLE GROUP ACCEPTED by the check constraint"; exit 1; }
          echo "OK: webtoon_studio_split_roles role_group check rejects outside the three groups"
          # One role of record per (series, group, payee), ever: the
          # UNIQUE triple refuses a duplicate registration (23505).
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into webtoon_studio_split_roles (series_id, role_group, payee_id, payee_name, share_bps, contract_ref) values ('wt_split_probe', 'original_creator_storywriter', 'payee_1', 'Payee', 3500, 'AGR-SPLIT-PROBE')"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into webtoon_studio_split_roles (series_id, role_group, payee_id, payee_name, share_bps, contract_ref) values ('wt_split_probe', 'original_creator_storywriter', 'payee_1', 'Payee', 3600, 'AGR-SPLIT-PROBE')" >/dev/null 2>&1 || true
          dup_roles=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from webtoon_studio_split_roles where series_id = 'wt_split_probe'")
          [ "$dup_roles" = "1" ] || { echo "DUPLICATE SPLIT ROLE ACCEPTED by the UNIQUE triple"; exit 1; }
          echo "OK: webtoon_studio_split_roles UNIQUE triple rejects duplicate roles"
          # One localizer of record per (series, language): a
          # re-registered contract REPLACES the row (the upsert surface),
          # never a second row for one feed.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into webtoon_localization_contracts (series_id, language_code, localizer_payee_id, localizer_payee_name, fee_mode, per_chapter_flat_fee_cents, rev_share_bps, contract_ref) values ('wt_loc_probe', 'es', 'loc_probe_1', 'Probe Localizer', 'flat_fee', 2500, 0, 'AGR-LOC-PROBE')"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into webtoon_localization_contracts (series_id, language_code, localizer_payee_id, localizer_payee_name, fee_mode, per_chapter_flat_fee_cents, rev_share_bps, contract_ref) values ('wt_loc_probe', 'es', 'loc_probe_2', 'Probe Localizer 2', 'rev_share', 0, 1500, 'AGR-LOC-PROBE-2') on conflict (series_id, language_code) do update set localizer_payee_id = excluded.localizer_payee_id, fee_mode = excluded.fee_mode, per_chapter_flat_fee_cents = excluded.per_chapter_flat_fee_cents, rev_share_bps = excluded.rev_share_bps, contract_ref = excluded.contract_ref"
          loc_rows=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from webtoon_localization_contracts where series_id = 'wt_loc_probe'")
          [ "$loc_rows" = "1" ] || { echo "SECOND LOCALIZER ROW ACCEPTED for one (series, language) feed"; exit 1; }
          echo "OK: webtoon_localization_contracts UNIQUE pair keeps one localizer of record per feed"
          # One recoupment pool of record per (series, class): the
          # print-advance pool and the digital-coin pool coexist ISOLATED
          # (two rows), but a duplicate within one class refuses.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into webtoon_recoupment_pools (series_id, pool_class, advance_cents, currency, status, advance_agreement_ref) values ('wt_pool_probe', 'print_advance', 100000, 'USD', 'active', 'AGR-PRINT-PROBE')"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into webtoon_recoupment_pools (series_id, pool_class, advance_cents, currency, status, advance_agreement_ref) values ('wt_pool_probe', 'digital_coin_unlock', 50000, 'USD', 'active', 'AGR-COIN-PROBE')"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into webtoon_recoupment_pools (series_id, pool_class, advance_cents, currency, status, advance_agreement_ref) values ('wt_pool_probe', 'print_advance', 75000, 'USD', 'active', 'AGR-PRINT-PROBE-2')" >/dev/null 2>&1 || true
          pool_rows=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from webtoon_recoupment_pools where series_id = 'wt_pool_probe'")
          [ "$pool_rows" = "2" ] || { echo "RECOUPMENT POOL ISOLATION BROKEN — expected one print + one coin pool"; exit 1; }
          echo "OK: webtoon_recoupment_pools UNIQUE pair keeps print and coin pools isolated"

          # IP adaptation optioning (migration 0025, Deep Royalties PR 21):
          # the option agreement of record, the ordered author-side IP
          # allocations, and the durable ip_rights_cleared verification
          # state — inventory, RLS deny-all, the guarded allocation FK, and
          # the check-constrained vocabularies.
          assert_cols ip_option_agreements id work_id author_payee_id author_payee_name agency_payee_id agency_payee_name agency_commission_bps option_deal_ref created_at updated_at
          assert_cols ip_option_author_allocations id work_id payee_id payee_name allocation_bps created_at insertion_order
          assert_cols publishing_ip_rights_verifications id payee_id work_id state evidence_ref cleared_at created_at updated_at
          for table in ip_option_agreements ip_option_author_allocations publishing_ip_rights_verifications; do
            rls_enabled=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select relrowsecurity from pg_class c join pg_namespace n on c.relnamespace = n.oid where n.nspname='public' and c.relname='$table'")
            [ "$rls_enabled" = "t" ] || { echo "RLS NOT ENABLED on $table"; exit 1; }
          done
          echo "OK: the three ip-option tables have RLS enabled"
          fk_exists=$(psql -h localhost -U postgres -d covnant_check -tAc \
            "select count(*) from pg_constraint where conrelid = 'public.ip_option_author_allocations'::regclass and conname = 'ip_option_author_allocations_work_fk'")
          [ "$fk_exists" = "1" ] || { echo "MISSING FK ip_option_author_allocations_work_fk"; exit 1; }
          echo "OK: ip_option_author_allocations agreement FK exists"
          # The FK MUST reject an allocation against an option agreement
          # that never landed — the insert is expected to fail.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into ip_option_author_allocations (work_id, payee_id, payee_name, allocation_bps) values ('ip_no_such_work', 'ip_alloc_probe_1', 'Probe Holder', 4000)" >/dev/null 2>&1 || true
          orphan_alloc=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from ip_option_author_allocations where work_id = 'ip_no_such_work'")
          [ "$orphan_alloc" = "0" ] || { echo "ORPHAN IP ALLOCATION ACCEPTED — the agreement FK is missing"; exit 1; }
          echo "OK: ip_option_author_allocations agreement FK rejects unregistered works"
          # One option agreement of record per work: a re-registered
          # agreement REPLACES the row (the upsert surface), never a second
          # row for one work.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into ip_option_agreements (work_id, author_payee_id, author_payee_name, agency_payee_id, agency_payee_name, agency_commission_bps, option_deal_ref) values ('ip_agreement_probe', 'ip_author_probe', 'Probe Author', 'ip_agency_probe', 'Probe Agency', 1000, 'AGR-OPTION-PROBE')"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into ip_option_agreements (work_id, author_payee_id, author_payee_name, agency_payee_id, agency_payee_name, agency_commission_bps, option_deal_ref) values ('ip_agreement_probe', 'ip_author_probe_2', 'Probe Author 2', 'ip_agency_probe_2', 'Probe Agency 2', 1500, 'AGR-OPTION-PROBE-2') on conflict (work_id) do update set author_payee_id = excluded.author_payee_id, agency_payee_id = excluded.agency_payee_id, agency_commission_bps = excluded.agency_commission_bps, option_deal_ref = excluded.option_deal_ref, updated_at = now()"
          agreement_rows=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from ip_option_agreements where work_id = 'ip_agreement_probe'")
          [ "$agreement_rows" = "1" ] || { echo "SECOND OPTION AGREEMENT ROW ACCEPTED for one work"; exit 1; }
          echo "OK: ip_option_agreements UNIQUE(work_id) keeps one option deal of record per work"
          # One IP allocation of record per (work, payee), ever: the UNIQUE
          # pair refuses a duplicate registration (the replay surface).
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into ip_option_author_allocations (work_id, payee_id, payee_name, allocation_bps) values ('ip_agreement_probe', 'ip_alloc_probe', 'Probe Co-holder', 2000)"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into ip_option_author_allocations (work_id, payee_id, payee_name, allocation_bps) values ('ip_agreement_probe', 'ip_alloc_probe', 'Probe Co-holder', 2500)" >/dev/null 2>&1 || true
          dup_allocs=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from ip_option_author_allocations where work_id = 'ip_agreement_probe' and payee_id = 'ip_alloc_probe'")
          [ "$dup_allocs" = "1" ] || { echo "DUPLICATE IP ALLOCATION ACCEPTED by the UNIQUE pair"; exit 1; }
          echo "OK: ip_option_author_allocations UNIQUE pair rejects duplicate registrations"
          # The verification vocabulary is exactly the three gate states:
          # anything else refuses at the DDL (the VTuber state-check probe,
          # at work scope).
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into publishing_ip_rights_verifications (payee_id, work_id, state) values ('ip_probe_payee', 'ip_agreement_probe', 'approved')" >/dev/null 2>&1 || true
          bad_state=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from publishing_ip_rights_verifications where payee_id = 'ip_probe_payee'")
          [ "$bad_state" = "0" ] || { echo "BAD IP-RIGHTS STATE ACCEPTED by the check constraint"; exit 1; }
          echo "OK: publishing_ip_rights_verifications state check rejects bad values"
          # One verification state per (payee, work): a re-verification
          # REPLACES the row (the upsert surface), never a second row.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into publishing_ip_rights_verifications (payee_id, work_id, state, evidence_ref, cleared_at) values ('ip_probe_payee', 'ip_agreement_probe', 'pending', null, null)"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into publishing_ip_rights_verifications (payee_id, work_id, state, evidence_ref, cleared_at) values ('ip_probe_payee', 'ip_agreement_probe', 'cleared', 'EVID-IP-PROBE', now()) on conflict (payee_id, work_id) do update set state = excluded.state, evidence_ref = excluded.evidence_ref, cleared_at = excluded.cleared_at, updated_at = now()"
          verif_rows=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from publishing_ip_rights_verifications where payee_id = 'ip_probe_payee'")
          [ "$verif_rows" = "1" ] || { echo "SECOND VERIFICATION ROW ACCEPTED for one (payee, work)"; exit 1; }
          echo "OK: publishing_ip_rights_verifications UNIQUE pair keeps one state of record per (payee, work)"

          # Merch COGS + collaboration waterfall (migration 0026, PR 22, the
          # founder merchandise directive): the seven production/FIFO/
          # collaboration/royalty/consignment tables' inventory, RLS
          # deny-all on all seven, the guarded FKs, the position-lock and
          # replay uniques, and the check-constrained vocabularies.
          assert_cols merch_cogs_lots id sku_id lot_ref units_produced cogs_per_unit_cents created_at
          assert_cols merch_cogs_consumptions id lot_id source_event_id units_consumed_before units_consumed cogs_per_unit_cents amortized_cents created_at
          assert_cols merch_collab_agreements id sku_id manufacturer_payee_id manufacturer_payee_name brand_payee_id brand_payee_name artist_payee_id artist_payee_name artist_split_bps blank_sourcing_cents screen_printing_cents agreement_ref created_at updated_at
          assert_cols merch_collab_recoupment_applications id agreement_id pool_class source_event_id recouped_before_cents applied_cents remaining_cents created_at
          assert_cols merch_designer_royalty_tiers id sku_id designer_payee_id designer_payee_name royalty_per_unit_cents created_at updated_at
          assert_cols merch_designer_royalty_billings id source_event_id sku_id designer_payee_id designer_payee_name units_billed royalty_per_unit_cents billed_cents created_at
          assert_cols merch_consignment_settlements id event_id period location sku_id units_sold gross_cents commission_cents shrinkage_allowance_cents net_payout_cents currency created_at
          for table in merch_cogs_lots merch_cogs_consumptions merch_collab_agreements merch_collab_recoupment_applications merch_designer_royalty_tiers merch_designer_royalty_billings merch_consignment_settlements; do
            rls_enabled=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select relrowsecurity from pg_class c join pg_namespace n on c.relnamespace = n.oid where n.nspname='public' and c.relname='$table'")
            [ "$rls_enabled" = "t" ] || { echo "RLS NOT ENABLED on $table"; exit 1; }
          done
          echo "OK: the seven merch tables have RLS enabled"
          fk_exists=$(psql -h localhost -U postgres -d covnant_check -tAc \
            "select count(*) from pg_constraint where conrelid = 'public.merch_cogs_consumptions'::regclass and conname = 'merch_cogs_consumptions_lot_fk'")
          [ "$fk_exists" = "1" ] || { echo "MISSING FK merch_cogs_consumptions_lot_fk"; exit 1; }
          echo "OK: merch_cogs_consumptions_lot_fk exists"
          # The FK MUST reject a FIFO consumption against a lot that never
          # landed — the insert is expected to fail.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into merch_cogs_consumptions (lot_id, source_event_id, units_consumed_before, units_consumed, cogs_per_unit_cents, amortized_cents) values ('00000000-0000-0000-0000-00000000dead', 'evt_merch_fk_probe', 0, 1, 650, 650)" >/dev/null 2>&1 || true
          orphan_cons=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from merch_cogs_consumptions where source_event_id = 'evt_merch_fk_probe'")
          [ "$orphan_cons" = "0" ] || { echo "ORPHAN FIFO CONSUMPTION ACCEPTED — the lot FK is missing"; exit 1; }
          echo "OK: merch_cogs_consumptions lot FK rejects unknown lots"
          # FIFO discipline as DDL: one consumption per (lot, event) — a
          # replayed fulfillment event is the UNIQUE, never a double
          # amortization — and one position per (lot, units_consumed_before):
          # a second event claiming the same position loses the insert-as-lock.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into merch_cogs_lots (id, sku_id, lot_ref, units_produced, cogs_per_unit_cents) values ('00000000-0000-0000-0000-0000000026a1', 'SKU-FIFO-PROBE', 'LOT-A', 10, 650)"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into merch_cogs_consumptions (lot_id, source_event_id, units_consumed_before, units_consumed, cogs_per_unit_cents, amortized_cents) values ('00000000-0000-0000-0000-0000000026a1', 'evt_fifo_probe_1', 0, 2, 650, 1300)"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into merch_cogs_consumptions (lot_id, source_event_id, units_consumed_before, units_consumed, cogs_per_unit_cents, amortized_cents) values ('00000000-0000-0000-0000-0000000026a1', 'evt_fifo_probe_1', 0, 2, 650, 1300)" >/dev/null 2>&1 || true
          dup_cons=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from merch_cogs_consumptions where source_event_id = 'evt_fifo_probe_1'")
          [ "$dup_cons" = "1" ] || { echo "DUPLICATE FIFO CONSUMPTION ACCEPTED by the UNIQUE pair"; exit 1; }
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into merch_cogs_consumptions (lot_id, source_event_id, units_consumed_before, units_consumed, cogs_per_unit_cents, amortized_cents) values ('00000000-0000-0000-0000-0000000026a1', 'evt_fifo_probe_2', 0, 3, 650, 1950)" >/dev/null 2>&1 || true
          pos_lock=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from merch_cogs_consumptions where source_event_id = 'evt_fifo_probe_2'")
          [ "$pos_lock" = "0" ] || { echo "SECOND EVENT CLAIMED THE SAME LOT POSITION — the insert-as-lock unique is missing"; exit 1; }
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into merch_cogs_consumptions (lot_id, source_event_id, units_consumed_before, units_consumed, cogs_per_unit_cents, amortized_cents) values ('00000000-0000-0000-0000-0000000026a1', 'evt_fifo_probe_2', 2, 3, 650, 1950)"
          echo "OK: merch_cogs_consumptions replay + position-lock uniques enforce FIFO"
          # The recoupment vocabulary is exactly the two overhead pools, and
          # one application holds a pool position: a second application
          # claiming the same (agreement, pool, position) loses the lock.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into merch_collab_agreements (sku_id, manufacturer_payee_id, manufacturer_payee_name, brand_payee_id, brand_payee_name, artist_payee_id, artist_payee_name, artist_split_bps, blank_sourcing_cents, screen_printing_cents, agreement_ref) values ('SKU-POOL-PROBE', 'mfg_merch_probe', 'Probe Mfg', 'brand_merch_probe', 'Probe Brand', 'artist_merch_probe', 'Probe Artist', 5000, 100000, 50000, 'AGR-MERCH-PROBE')"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into merch_collab_recoupment_applications (agreement_id, pool_class, source_event_id, recouped_before_cents, applied_cents, remaining_cents) select id, 'merch', 'evt_pool_probe_0', 0, 100, 99900 from merch_collab_agreements where sku_id = 'SKU-POOL-PROBE'" >/dev/null 2>&1 || true
          bad_pool=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from merch_collab_recoupment_applications where source_event_id = 'evt_pool_probe_0'")
          [ "$bad_pool" = "0" ] || { echo "UNKNOWN RECOUPMENT POOL ACCEPTED by the class check"; exit 1; }
          echo "OK: merch_collab_recoupment_applications pool check rejects unknown pools"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into merch_collab_recoupment_applications (agreement_id, pool_class, source_event_id, recouped_before_cents, applied_cents, remaining_cents) select id, 'blank_sourcing', 'evt_pool_probe_1', 0, 100, 99900 from merch_collab_agreements where sku_id = 'SKU-POOL-PROBE'"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into merch_collab_recoupment_applications (agreement_id, pool_class, source_event_id, recouped_before_cents, applied_cents, remaining_cents) select id, 'blank_sourcing', 'evt_pool_probe_2', 0, 100, 99900 from merch_collab_agreements where sku_id = 'SKU-POOL-PROBE'" >/dev/null 2>&1 || true
          dup_pool=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from merch_collab_recoupment_applications where agreement_id = (select id from merch_collab_agreements where sku_id = 'SKU-POOL-PROBE') and recouped_before_cents = 0")
          [ "$dup_pool" = "1" ] || { echo "SECOND APPLICATION CLAIMED THE SAME POOL POSITION — the insert-as-lock unique is missing"; exit 1; }
          echo "OK: merch_collab_recoupment_applications position lock enforces one application per pool position"
          # The designer royalty billing FK guards the tier of record: a
          # billing for a sku with no tier refuses at the DDL; with a tier,
          # the UNIQUE (source_event_id, sku_id) replays as one row.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into merch_designer_royalty_billings (source_event_id, sku_id, designer_payee_id, designer_payee_name, units_billed, royalty_per_unit_cents, billed_cents) values ('evt_tier_fk_probe', 'SKU-NO-TIER', 'des_merch_probe', 'Probe Designer', 2, 350, 700)" >/dev/null 2>&1 || true
          orphan_bill=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from merch_designer_royalty_billings where source_event_id = 'evt_tier_fk_probe'")
          [ "$orphan_bill" = "0" ] || { echo "ORPHAN ROYALTY BILLING ACCEPTED — the tier FK is missing"; exit 1; }
          echo "OK: merch_designer_royalty_billings tier FK rejects untiered skus"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into merch_designer_royalty_tiers (sku_id, designer_payee_id, designer_payee_name, royalty_per_unit_cents) values ('SKU-TIER-PROBE', 'des_merch_probe', 'Probe Designer', 350)"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into merch_designer_royalty_billings (source_event_id, sku_id, designer_payee_id, designer_payee_name, units_billed, royalty_per_unit_cents, billed_cents) values ('evt_tier_probe', 'SKU-TIER-PROBE', 'des_merch_probe', 'Probe Designer', 2, 350, 700)"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into merch_designer_royalty_billings (source_event_id, sku_id, designer_payee_id, designer_payee_name, units_billed, royalty_per_unit_cents, billed_cents) values ('evt_tier_probe', 'SKU-TIER-PROBE', 'des_merch_probe', 'Probe Designer', 2, 350, 700)" >/dev/null 2>&1 || true
          dup_bill=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from merch_designer_royalty_billings where source_event_id = 'evt_tier_probe'")
          [ "$dup_bill" = "1" ] || { echo "DUPLICATE ROYALTY BILLING ACCEPTED by the UNIQUE pair"; exit 1; }
          echo "OK: merch_designer_royalty_billings replay unique rejects a re-billed fulfillment event"
          # The consignment settlement replay guard: a re-shipped payout
          # report is the UNIQUE event_id, never a double settlement.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into merch_consignment_settlements (event_id, period, location, sku_id, units_sold, gross_cents, commission_cents, shrinkage_allowance_cents, net_payout_cents, currency) values ('evt_consignment_probe', '2026-09', 'store-42', 'SKU-CONS-PROBE', 3, 22500, 3375, 225, 18900, 'USD')"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into merch_consignment_settlements (event_id, period, location, sku_id, units_sold, gross_cents, commission_cents, shrinkage_allowance_cents, net_payout_cents, currency) values ('evt_consignment_probe', '2026-09', 'store-42', 'SKU-CONS-PROBE', 3, 22500, 3375, 225, 18900, 'USD')" >/dev/null 2>&1 || true
          dup_settle=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from merch_consignment_settlements where event_id = 'evt_consignment_probe'")
          [ "$dup_settle" = "1" ] || { echo "DUPLICATE CONSIGNMENT SETTLEMENT ACCEPTED by the UNIQUE event_id"; exit 1; }
          echo "OK: merch_consignment_settlements UNIQUE event_id rejects a replayed payout report"

          # Merch returns reserve + fulfillment confirmation (migration
          # 0027, PR 23): the deal-of-record bands, the drawdown replay +
          # position uniques, the tracking state vocabulary, and RLS
          # deny-all on all three.
          assert_cols merch_return_reserve_policies id sku_id reserve_rate_bps reserve_window_days beneficiary_payee_id beneficiary_payee_name created_at updated_at
          assert_cols merch_reserve_drawdowns id reserve_ledger_id drawdown_class source_event_id drawn_before_cents drawn_cents remaining_cents created_at
          assert_cols merch_fulfillment_trackings id fulfillment_event_id tracking_number tracking_state carrier delivered_at created_at
          for table in merch_return_reserve_policies merch_reserve_drawdowns merch_fulfillment_trackings; do
            rls_enabled=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select relrowsecurity from pg_class c join pg_namespace n on c.relnamespace = n.oid where n.nspname='public' and c.relname='$table'")
            [ "$rls_enabled" = "t" ] || { echo "RLS NOT ENABLED on $table"; exit 1; }
          done
          echo "OK: the three 0027 merch tables have RLS enabled"
          # A hostile contract (a holdback outside the founder's 10-15%
          # band) is unrepresentable at rest.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into merch_return_reserve_policies (sku_id, reserve_rate_bps, reserve_window_days, beneficiary_payee_id, beneficiary_payee_name) values ('SKU-RES-PROBE', 1600, 45, 'ben_merch_probe', 'Probe Beneficiary')" >/dev/null 2>&1 || true
          bad_band=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from merch_return_reserve_policies where sku_id = 'SKU-RES-PROBE'")
          [ "$bad_band" = "0" ] || { echo "OUT-OF-BAND HOLDBACK RATE ACCEPTED by the band check"; exit 1; }
          echo "OK: merch_return_reserve_policies band check rejects a hostile contract"
          # The drawdown replay guard: a re-shipped return event is the
          # UNIQUE (reserve, source_event), never a double drawdown.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into ledger_transactions (id, split_run_id, line_item_id, payee_id, payee_name, role, share_bps, amount_cents, currency, status, created_at, kind) values ('00000000-0000-0000-0000-0000000027a1', 'run_res_probe', 'line_res_probe', 'res_probe_payee', 'Probe Reserve', 'platform', 10000, 5000, 'USD', 'merch_returns_reserve', now(), 'royalty')"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into merch_reserve_drawdowns (reserve_ledger_id, drawdown_class, source_event_id, drawn_before_cents, drawn_cents, remaining_cents) values ('00000000-0000-0000-0000-0000000027a1', 'customer_return', 'evt_res_probe_1', 0, 500, 4500)"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into merch_reserve_drawdowns (reserve_ledger_id, drawdown_class, source_event_id, drawn_before_cents, drawn_cents, remaining_cents) values ('00000000-0000-0000-0000-0000000027a1', 'customer_return', 'evt_res_probe_1', 500, 500, 4000)" >/dev/null 2>&1 || true
          dup_draw=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from merch_reserve_drawdowns where source_event_id = 'evt_res_probe_1'")
          [ "$dup_draw" = "1" ] || { echo "DUPLICATE RESERVE DRAWDOWN ACCEPTED by the UNIQUE pair"; exit 1; }
          echo "OK: merch_reserve_drawdowns replay unique rejects a re-shipped return event"
          # The tracking state vocabulary: a bogus lifecycle refuses, and
          # only 'delivered' exists to confirm fulfillment.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into merch_fulfillment_trackings (fulfillment_event_id, tracking_number, tracking_state, carrier) values ('evt_track_probe', '1Z999', 'lost', 'UPS')" >/dev/null 2>&1 || true
          bad_state=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from merch_fulfillment_trackings where fulfillment_event_id = 'evt_track_probe'")
          [ "$bad_state" = "0" ] || { echo "BOGUS TRACKING STATE ACCEPTED by the state check"; exit 1; }
          echo "OK: merch_fulfillment_trackings state check rejects unknown lifecycles"

          # AI model registry (migration 0028, PR 24, the founder AI
          # directive): the nested derivative split contract of record per
          # model and the contributors' registered dataset token weights —
          # the directive's defaults as row values, the nested ORDER
          # enforced at rest, and RLS deny-all on both.
          assert_cols ai_model_split_terms id ai_model_id base_model_provider_fee_bps developer_split_bps contributor_pool_bps base_model_provider_payee_id base_model_provider_payee_name developer_payee_id developer_payee_name model_operator_payee_id model_operator_payee_name created_at updated_at
          assert_cols ai_model_contributions id ai_model_id contributor_payee_id contributor_payee_name contributor_class dataset_token_weight created_at updated_at
          for table in ai_model_split_terms ai_model_contributions; do
            rls_enabled=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select relrowsecurity from pg_class c join pg_namespace n on c.relnamespace = n.oid where n.nspname='public' and c.relname='$table'")
            [ "$rls_enabled" = "t" ] || { echo "RLS NOT ENABLED on $table"; exit 1; }
          done
          echo "OK: the two AI registry tables have RLS enabled"
          # The directive's default contract prices at rest: 2000/5000/3000.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into ai_model_split_terms (ai_model_id, base_model_provider_fee_bps, developer_split_bps, contributor_pool_bps, base_model_provider_payee_id, base_model_provider_payee_name, developer_payee_id, developer_payee_name, model_operator_payee_id, model_operator_payee_name) values ('gpt-probe', 2000, 5000, 3000, 'prov_ai_probe', 'Probe Provider', 'dev_ai_probe', 'Probe FineTuner', 'op_ai_probe', 'Probe Operator')"
          # One contract per model: the registry upserts on this key, so a
          # second INSERT for the same model is the DDL guard refusing.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into ai_model_split_terms (ai_model_id, base_model_provider_fee_bps, developer_split_bps, contributor_pool_bps, base_model_provider_payee_id, base_model_provider_payee_name, developer_payee_id, developer_payee_name, model_operator_payee_id, model_operator_payee_name) values ('gpt-probe', 1000, 1000, 1000, 'prov_ai_probe2', 'Probe Provider 2', 'dev_ai_probe2', 'Probe FineTuner 2', 'op_ai_probe2', 'Probe Operator 2')" >/dev/null 2>&1 || true
          dup_terms=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from ai_model_split_terms where ai_model_id = 'gpt-probe'")
          [ "$dup_terms" = "1" ] || { echo "SECOND SPLIT CONTRACT ACCEPTED for one model"; exit 1; }
          echo "OK: ai_model_split_terms UNIQUE per model keeps one contract of record"
          # The nested ORDER as DDL: a contract whose fine-tuner split and
          # contributor pool over-commit the post-fee remainder refuses.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into ai_model_split_terms (ai_model_id, base_model_provider_fee_bps, developer_split_bps, contributor_pool_bps, base_model_provider_payee_id, base_model_provider_payee_name, developer_payee_id, developer_payee_name, model_operator_payee_id, model_operator_payee_name) values ('gpt-overcommit', 2000, 5000, 6000, 'prov_ai_probe', 'Probe Provider', 'dev_ai_probe', 'Probe FineTuner', 'op_ai_probe', 'Probe Operator')" >/dev/null 2>&1 || true
          over=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from ai_model_split_terms where ai_model_id = 'gpt-overcommit'")
          [ "$over" = "0" ] || { echo "OVER-COMMITTED NESTED SPLIT ACCEPTED by the nested-order check"; exit 1; }
          echo "OK: ai_model_split_terms nested-order check rejects an over-committed remainder"
          # The contributor registry: exact-decimal weights ride as text
          # (the 1e-8 micros space), the class vocabulary is bounded, a
          # zero/negative weight refuses, and a re-shipped attribution row
          # is the UNIQUE (model, payee), never a second registration.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -c "insert into ai_model_contributions (ai_model_id, contributor_payee_id, contributor_payee_name, contributor_class, dataset_token_weight) values ('gpt-probe', 'data_ai_probe', 'Probe Data', 'dataset', '0.00000001')"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into ai_model_contributions (ai_model_id, contributor_payee_id, contributor_payee_name, contributor_class, dataset_token_weight) values ('gpt-probe', 'voice_ai_probe', 'Probe Voice', 'voice_model', '0.00000001')" >/dev/null 2>&1 || true
          bad_class=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from ai_model_contributions where contributor_payee_id = 'voice_ai_probe'")
          [ "$bad_class" = "0" ] || { echo "UNKNOWN CONTRIBUTOR CLASS ACCEPTED by the class check"; exit 1; }
          echo "OK: ai_model_contributions class check rejects unknown vocabularies"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into ai_model_contributions (ai_model_id, contributor_payee_id, contributor_payee_name, contributor_class, dataset_token_weight) values ('gpt-probe', 'zero_ai_probe', 'Probe Zero', 'dataset', '0')" >/dev/null 2>&1 || true
          zero_weight=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from ai_model_contributions where contributor_payee_id = 'zero_ai_probe'")
          [ "$zero_weight" = "0" ] || { echo "ZERO DATASET TOKEN WEIGHT ACCEPTED by the weight check"; exit 1; }
          echo "OK: ai_model_contributions weight check rejects non-positive weights"
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=0 -c "insert into ai_model_contributions (ai_model_id, contributor_payee_id, contributor_payee_name, contributor_class, dataset_token_weight) values ('gpt-probe', 'data_ai_probe', 'Probe Data', 'dataset', '0.00000002')" >/dev/null 2>&1 || true
          dup_contrib=$(psql -h localhost -U postgres -d covnant_check -tAc "select count(*) from ai_model_contributions where ai_model_id = 'gpt-probe' and contributor_payee_id = 'data_ai_probe'")
          [ "$dup_contrib" = "1" ] || { echo "SECOND REGISTRATION ROW ACCEPTED for one (model, contributor)"; exit 1; }
          echo "OK: ai_model_contributions UNIQUE pair keeps one weight of record per (model, contributor)"

      - name: Intent-first withdrawal regression (migration 0058) — real Postgres concurrency
        env:
          PGPASSWORD: postgres
        run: |
          # Audit note_c5ksDgVw #4/#5, at the RPC level the withdraw route
          # leans on: reserve_escrow_withdrawal must hold funds as a pending
          # intent BEFORE any dispatch, refuse the concurrent/retry
          # withdrawal of the same funds, restore them on release, and keep
          # settled funds spent once the ledger debit exists. Real Postgres,
          # real advisory lock, real parallel sessions.
          PSQL="psql -h localhost -U postgres -d covnant_check -tAX -v ON_ERROR_STOP=1"
          # Seed: $2.00 gross settled for the probe holder (the route
          # supplies the engine's 24% unverified-US rate → $0.48 withheld →
          # $1.52 available).
          $PSQL -c "insert into universal_royalty_ledger (transaction_id, cbt_code, platform, gross_settled, currency, disbursements) values ('ci_probe_0058', 'CI-PROBE', 'CI', 2.0, 'USD', '[{\"rightsHolderId\": \"probe_rh\", \"grossShare\": 2.0}]'::jsonb)"
          # 1) The first reserve of the full available balance wins.
          r1=$($PSQL -c "select (reserve_escrow_withdrawal('ci_intent_1', 'probe_rh', 152000000, 0.24) ->> 'reserved')")
          [ "$r1" = "true" ] || { echo "FIRST RESERVE REFUSED: $r1"; exit 1; }
          # 2) The immediate retry of the SAME funds refuses — the winner's
          # pending hold is exactly what the loser of a race sees (#4).
          r2=$($PSQL -c "select (reserve_escrow_withdrawal('ci_intent_2', 'probe_rh', 152000000, 0.24) ->> 'reserved')")
          [ "$r2" = "false" ] || { echo "RETRY OF SPENT FUNDS ACCEPTED: $r2"; exit 1; }
          echo "OK: the reserve holds funds and refuses the retry of the same funds"
          # 3) Release restores the funds, then a 6-way PARALLEL race fires:
          # the per-holder advisory lock serializes the reserves and exactly
          # one wins (the pre-fix code let every reader pass the same check).
          $PSQL -c "update escrow_withdrawal_intents set status='released', released_at=now() where id='ci_intent_1'"
          for i in 1 2 3 4 5 6; do
            $PSQL -c "select (reserve_escrow_withdrawal('ci_race_$i', 'probe_rh', 152000000, 0.24) ->> 'reserved')" > "/tmp/race_$i.out" 2>&1 &
          done
          wait
          wins=$(grep -c '^true$' /tmp/race_*.out | awk -F: '{s+=$2} END {print s}')
          [ "$wins" = "1" ] || { echo "PARALLEL RACE ADMITTED $wins WINNERS (exactly 1 required)"; cat /tmp/race_*.out; exit 1; }
          pending=$($PSQL -c "select count(*) from escrow_withdrawal_intents where rights_holder_id='probe_rh' and status='pending'")
          [ "$pending" = "1" ] || { echo "RACE LEFT $pending PENDING HOLDS (need exactly 1)"; exit 1; }
          echo "OK: exactly one of six parallel withdrawals wins the same funds"
          # 4) The settle leg: the intent flips with its timestamp (the
          # status/timestamp pinning CHECK refuses a settle without one)...
          winner=$($PSQL -c "select id from escrow_withdrawal_intents where rights_holder_id='probe_rh' and status='pending'")
          $PSQL -v ON_ERROR_STOP=0 -c "update escrow_withdrawal_intents set status='settled' where id='$winner'" >/dev/null 2>&1 || true
          bare_settle=$($PSQL -c "select count(*) from escrow_withdrawal_intents where id='$winner' and status='settled'")
          [ "$bare_settle" = "0" ] || { echo "SETTLE WITHOUT settled_at ACCEPTED by the pinning check"; exit 1; }
          $PSQL -c "update escrow_withdrawal_intents set status='settled', settled_at=now(), plaid_transfer_id='tr_ci_probe' where id='$winner'"
          # 5) ...reconciliation restores the DISBURSEMENT ledger row (the
          # route writes ESCROW-PAYOUT-<intent_id>, idempotent on the
          # ledger's UNIQUE(transaction_id)), and the settled funds STAY
          # SPENT: the balance math counts the payout debit, so the same
          # 1.52 refuses a second time.
          $PSQL -c "update universal_royalty_ledger set disbursements = disbursements || jsonb_build_array(jsonb_build_object('type', 'DISBURSEMENT', 'rightsHolderId', 'probe_rh', 'payoutAmount', '152000000', 'amountPaid', '115520000', 'taxWithheld', '36480000', 'timestamp', (extract(epoch from now()) * 1000)::bigint, 'remainingNetBalance', '0')) where transaction_id = 'ci_probe_0058'"
          r3=$($PSQL -c "select (reserve_escrow_withdrawal('ci_intent_3', 'probe_rh', 152000000, 0.24) ->> 'reserved')")
          [ "$r3" = "false" ] || { echo "SETTLED FUNDS WITHDRAWABLE AGAIN (ledger debit not counted): $r3"; exit 1; }
          echo "OK: settled funds stay spent — the ledger debit closes the repeat-withdrawal window (#5)"
          # 6) The money-shape CHECK refuses a negative or non-integer hold.
          $PSQL -v ON_ERROR_STOP=0 -c "insert into escrow_withdrawal_intents (id, rights_holder_id, amount_units) values ('ci_bad_neg', 'probe_rh', '-5')" >/dev/null 2>&1 || true
          $PSQL -v ON_ERROR_STOP=0 -c "insert into escrow_withdrawal_intents (id, rights_holder_id, amount_units) values ('ci_bad_nan', 'probe_rh', '1.5e9')" >/dev/null 2>&1 || true
          bad=$($PSQL -c "select count(*) from escrow_withdrawal_intents where id in ('ci_bad_neg', 'ci_bad_nan')")
          [ "$bad" = "0" ] || { echo "NEGATIVE OR NON-INTEGER HOLD ACCEPTED by the amount CHECK"; exit 1; }
          echo "OK: the amount_units CHECK refuses negative and non-integer holds"
          # 7) Locking down the gate itself: the reserve RPC is service-role
          # only — PUBLIC must not hold EXECUTE, and the intent table must
          # have RLS enabled.
          public_exec=$(psql -h localhost -U postgres -d covnant_check -tAX -c "select has_function_privilege('public', 'reserve_escrow_withdrawal(text,text,numeric,numeric)', 'execute')")
          # psql -tA renders a plain boolean as t/f (the RPC probes above
          # compare JSONB text, which renders as true/false).
          [ "$public_exec" = "f" ] || { echo "PUBLIC STILL HOLDS EXECUTE on reserve_escrow_withdrawal (got: $public_exec)"; exit 1; }
          rls=$(psql -h localhost -U postgres -d covnant_check -tAX -c "select relrowsecurity from pg_class where oid = 'public.escrow_withdrawal_intents'::regclass")
          [ "$rls" = "t" ] || { echo "RLS NOT ENABLED on escrow_withdrawal_intents"; exit 1; }
          echo "OK: reserve_escrow_withdrawal is service-role-only and the intent table has RLS"

      - name: YTD increment regression (migrations 0057/0061) — real Postgres RPC calls
        env:
          PGPASSWORD: postgres
        run: |
          # The blind spot that shipped hotfix 0061: the apply-twice loop above
          # never CALLS the RPCs it installs. increment_creator_ytd shipped in
          # 0057 with its data-modifying CTE inside a parenthesized scalar
          # return — PostgreSQL rejected the function on EVERY call (SQLSTATE
          # 0A000, probed live on production 2026-10-06) while the schema job
          # stayed green. This step CALLS increment_creator_ytd the way the
          # compliance engine's applyWithholding does: first call inserts, the
          # second accumulates through the on-conflict arm, in autocommit and
          # inside an explicit transaction. A control first proves this step
          # FAILS on the exact broken body that shipped — a rotten gate is
          # worse than no gate.
          PSQL="psql -h localhost -U postgres -d covnant_check -tAX -v ON_ERROR_STOP=1"

          # Control: recreate the ORIGINAL 0057 body — the call must FAIL.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 <<'SQL' >/dev/null
          create or replace function public.increment_creator_ytd(
            p_creator_id     text,
            p_tax_year       integer,
            p_gross_delta    bigint,
            p_withheld_delta bigint,
            p_updated_at     timestamptz
          ) returns jsonb
          language plpgsql
          set search_path = public
          as $$
          begin
            return (
              with upserted as (
                insert into public.creator_ytd_earnings as y (
                  creator_id, tax_year, gross_cents, withheld_cents, updated_at
                ) values (
                  p_creator_id, p_tax_year, p_gross_delta, p_withheld_delta, p_updated_at
                )
                on conflict (creator_id, tax_year) do update set
                  gross_cents    = y.gross_cents + excluded.gross_cents,
                  withheld_cents = y.withheld_cents + excluded.withheld_cents,
                  updated_at     = excluded.updated_at
                returning creator_id, tax_year, gross_cents, withheld_cents, updated_at
              )
              select to_jsonb(upserted) from upserted
            );
          end;
          $$;
          SQL
          if $PSQL -c "select increment_creator_ytd('ci_ytd_control', 2026, 1, 1, now())" >/dev/null 2>&1; then
            echo "REGRESSION GATE ROTTEN: the broken 0057 body called fine"; exit 1
          fi
          echo "OK: control — the broken 0057 body fails the call (the gate detects the bug)"

          # Restore the fixed 0061 body; re-applying AFTER calls have run also
          # proves the replay-safe double-apply on a database with data.
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 \
            -f supabase/migrations/0061_creator_ytd_increment_fix.sql >/dev/null
          $PSQL -c "delete from creator_ytd_earnings where creator_id in ('ci_ytd_control', 'ci_ytd_creator')" >/dev/null

          # 1) Autocommit: the first call inserts and returns the jsonb row —
          #    the exact envelope SupabaseStore.incrementCreatorYtd reads.
          r1=$($PSQL -c "select increment_creator_ytd('ci_ytd_creator', 2026, 60000, 14400, now())")
          echo "$r1" | grep -F '"creator_id": "ci_ytd_creator"' >/dev/null || { echo "BAD ENVELOPE (creator_id): $r1"; exit 1; }
          echo "$r1" | grep -F '"gross_cents": 60000'           >/dev/null || { echo "BAD ENVELOPE (insert-arm gross): $r1"; exit 1; }
          echo "$r1" | grep -F '"withheld_cents": 14400'        >/dev/null || { echo "BAD ENVELOPE (insert-arm withheld): $r1"; exit 1; }
          echo "OK: autocommit call returns the post-insert jsonb row"
          # 2) Second call INSIDE an explicit transaction accumulates through
          #    the on-conflict arm: 60000+100 gross → 60100, 14400+24 → 14424.
          txout=$($PSQL <<'SQL'
          begin;
          select increment_creator_ytd('ci_ytd_creator', 2026, 100, 24, now());
          commit;
          SQL
          )
          echo "$txout" | grep -F '"gross_cents": 60100'    >/dev/null || { echo "BAD ACCUMULATE (gross): $txout"; exit 1; }
          echo "$txout" | grep -F '"withheld_cents": 14424' >/dev/null || { echo "BAD ACCUMULATE (withheld): $txout"; exit 1; }
          echo "OK: in-transaction accumulate returns 60100/14424"
          # 3) The write actually landed — persisted row matches and the PK
          #    kept it a single row (the upsert never created a second row).
          row=$($PSQL -c "select gross_cents || '/' || withheld_cents || '/' || count(*) over () from creator_ytd_earnings where creator_id = 'ci_ytd_creator' and tax_year = 2026")
          [ "$row" = "60100/14424/1" ] || { echo "BAD PERSISTED ROW: $row"; exit 1; }
          echo "OK: persisted 60100/14424 in exactly one row (upsert-on-conflict verified)"
          # 4) One more call after everything above: the arithmetic survives
          #    replacement + data (60100+1 → 60101, 14424+1 → 14425), and the
          #    returned jsonb keeps EXACTLY the five store keys.
          r4=$($PSQL -c "select increment_creator_ytd('ci_ytd_creator', 2026, 1, 1, now())")
          echo "$r4" | grep -F '"gross_cents": 60101'    >/dev/null || { echo "BAD POST-REPLACE ACCUMULATE (gross): $r4"; exit 1; }
          echo "$r4" | grep -F '"withheld_cents": 14425' >/dev/null || { echo "BAD POST-REPLACE ACCUMULATE (withheld): $r4"; exit 1; }
          keys=$($PSQL -c "select string_agg(k, ',' order by k) from jsonb_object_keys(increment_creator_ytd('ci_ytd_creator', 2026, 0, 0, now())) k")
          [ "$keys" = "creator_id,gross_cents,tax_year,updated_at,withheld_cents" ] || { echo "DRIFTED JSONB KEYS: $keys"; exit 1; }
          echo "OK: post-replacement accumulate + exact five-key jsonb envelope"
          # 5) The production caller holds EXECUTE.
          svc=$($PSQL -c "select has_function_privilege('service_role', 'increment_creator_ytd(text,integer,bigint,bigint,timestamptz)', 'execute')")
          [ "$svc" = "t" ] || { echo "service_role LOST EXECUTE: $svc"; exit 1; }
          echo "OK: service_role execute grant in place"

      - name: Founder v12 acceptance suite in the Docker harness (addenda 31-32)
        run: |
          bash supabase/tests/0012_docker_harness.sh

  identifier-engine:
    # Canon v16: the founder's ingestion suite runs against a REAL
    # PostgreSQL with the validate_global_identifier trigger active, plus
    # Redis for the v22 sliding-window limiter. Skipped locally without
    # TEST_DATABASE_URL — always green here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: universal_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply identity migrations (0012 + 0015)
        env:
          PGPASSWORD: postgres
        run: |
          # Supabase-auth shim (test-only, never shipped as a migration):
          # the identity migrations grant to the Supabase service_role,
          # which vanilla Postgres lacks. Mirrors the schema job shim.
          psql -h localhost -U postgres -d universal_registry_test -v ON_ERROR_STOP=1 <<'SQL'
            do $$ begin
              if not exists (select from pg_roles where rolname = 'service_role') then
                create role service_role nologin;
              end if;
            end $$;
          SQL
          psql -h localhost -U postgres -d universal_registry_test -v ON_ERROR_STOP=1 -f supabase/migrations/0012_universal_identity.sql
          psql -h localhost -U postgres -d universal_registry_test -v ON_ERROR_STOP=1 -f supabase/migrations/0015_spatial_web3_identifiers.sql

      - name: Integration suite against real PostgreSQL + Redis
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/universal_registry_test
          REDIS_URL: redis://localhost:6379
        run: npx vitest run src/app/api/v1/identifiers/batch-ingest/__tests__/route.integration.test.ts

      - name: Identifier engine unit + acceptance suites
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/universal_registry_test
          REDIS_URL: redis://localhost:6379
        run: |
          npx vitest run \
            src/lib/identifiers/__tests__/globalIdentifiers.test.ts \
            src/lib/identifiers/__tests__/ingestRecords.test.ts \
            src/lib/identifiers/__tests__/resolveGlobalIdentifier.test.ts \
            src/lib/server/__tests__/identifierAuth.test.ts \
            src/lib/admin/__tests__/registryDashboard.test.ts \
            src/app/api/v1/identifiers/batch-ingest/__tests__/route.test.ts \
            src/app/api/v1/webhooks/telemetry-stream/__tests__/route.test.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Restore the Chromium download when package-lock.json is unchanged.
      # The install step below still runs (--with-deps guarantees OS libs);
      # on a cache hit it is a fast no-op for the browser download itself.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Cache the Next.js incremental build cache (same keys as the verify
      # job). The post-build save happens automatically via the post step.
      - name: Cache .next/cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: E2E suite
        run: npm run test:e2e
        env:
          # Throwaway e2e password — deliberately NOT the production secret.
          # The production ADMIN_DASHBOARD_PASSWORD is set in Vercel after merge.
          ADMIN_DASHBOARD_PASSWORD: e2e-admin-test-password

      # A single e2e failure (asset-studio MUL registration) hung at
      # waitForURL three times on CI while passing every local run — the
      # page snapshot and trace in test-results/ are the only way to see
      # what the page actually showed. Upload them whenever the suite fails.
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results/
          retention-days: 7

