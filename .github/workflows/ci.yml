name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: covnant_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations to scratch Postgres
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0001_covenant_init.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0002_contracts.sql
          psql -h localhost -U postgres -d covnant_check -v ON_ERROR_STOP=1 -f supabase/migrations/0003_gateway_telemetry.sql

      - name: Assert the engine's exact columns exist
        env:
          PGPASSWORD: postgres
        run: |
          assert_cols() {
            local table="$1"; shift
            local cols=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select column_name from information_schema.columns where table_schema='public' and table_name='$table'")
            for col in "$@"; do
              echo "$cols" | grep -qx "$col" || { echo "MISSING $table.$col"; exit 1; }
            done
            echo "OK: $table ($# columns asserted)"
          }
          assert_rls() {
            local table="$1"
            local enabled=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select relrowsecurity from pg_class where relnamespace = 'public'::regnamespace and relname='$table'")
            [ "$enabled" = "t" ] || { echo "RLS NOT ENABLED: $table"; exit 1; }
            echo "OK: RLS enabled on $table"
          }
          assert_policy() {
            local policy="$1"
            local found=$(psql -h localhost -U postgres -d covnant_check -tAc \
              "select count(*) from pg_policies where schemaname='public' and policyname='$policy'")
            [ "$found" -ge 1 ] || { echo "MISSING POLICY: $policy"; exit 1; }
            echo "OK: policy $policy"
          }
          assert_cols cbt_assets cbt_code
          assert_cols universal_royalty_ledger transaction_id cbt_code platform gross_settled covenant_fee corner_dust_collected currency disbursements created_at
          assert_cols platform_allowlists cbt_code
          assert_cols contracts id cbt_code template_id industry status fields document
          assert_cols creator_telemetry id auth_user_id legal_name artist_name regular_email business_email phone phone_verified verified_at created_at
          assert_cols platform_admin_allowlists id auth_user_id granted_by note created_at

          # Gateway tables are RLS-enabled and admin-gated (spec directives A/B).
          assert_rls creator_telemetry
          assert_rls platform_admin_allowlists
          assert_policy creator_telemetry_insert_authenticated
          assert_policy platform_admin_allowlists_select_authenticated

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E suite
        run: npm run test:e2e
